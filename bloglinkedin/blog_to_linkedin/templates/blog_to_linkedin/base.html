<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Blog to LinkedIn Converter{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .prose p { margin-bottom: 1rem; }
    .hero-gradient { background: linear-gradient(135deg, #4f46e5 0%, #22c55e 100%); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="min-h-screen">
    <header class="bg-white border-b border-slate-200">
      <div class="mx-auto max-w-7xl px-6 py-5 lg:px-8">
        <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
          <a href="{% url 'blog_to_linkedin:home' %}" class="text-xl font-semibold text-slate-900">Blog to LinkedIn</a>
          <nav class="flex flex-wrap gap-4 text-sm text-slate-600">
            <a href="#upload">Upload</a>
            <a href="#how-it-works">How it works</a>
            <a href="#faq">FAQ</a>
          </nav>
        </div>
      </div>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="border-t border-slate-200 bg-white py-8">
      <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <div class="flex flex-col gap-4 text-sm text-slate-600 md:flex-row md:items-center md:justify-between">
          <nav class="flex gap-4">
            <a href="#privacy" class="hover:underline">Privacy</a>
            <a href="#terms" class="hover:underline">Terms &amp; Conditions</a>
            <a href="#contact" class="hover:underline">Contact</a>
            <a href="#help" class="hover:underline">Help</a>
          </nav>
          <p>© 2026 Blog to LinkedIn</p>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
