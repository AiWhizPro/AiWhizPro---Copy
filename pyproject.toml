[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiwhizpro-blog-to-linkedin"
version = "1.0.0"
description = "Blog to LinkedIn converter - repurpose articles into engaging LinkedIn posts"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "AiWhizPro Team", email = "team@aiwhizpro.com"}
]
keywords = ["django", "blog", "linkedin", "content-repurposing", "converter"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django :: 6.0",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "Django>=6.0.6",
    "python-docx>=0.8.11",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "gunicorn>=21.0.0",
    "psycopg2-binary>=2.9.0",
    "python-decouple>=3.8",
    "whitenoise>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "django-debug-toolbar>=4.0.0",
    "coverage>=7.0.0",
]

[tool.setuptools]
packages = ["blog_to_linkedin", "bloglinkedin"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]

[tool.coverage.run]
source = ["blog_to_linkedin"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
