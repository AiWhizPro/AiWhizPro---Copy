version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: aiwhizpro-db
    environment:
      POSTGRES_DB: aiwhizpro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: aiwhizpro-web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py createsuperuser --noinput --username admin --email admin@example.com || true &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 bloglinkedin.wsgi:application"
    volumes:
      - .:/app
      - static_volume:/app/bloglinkedin/staticfiles
      - media_volume:/app/bloglinkedin/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/aiwhizpro
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - ADMINPASS=admin123
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  static_volume:
  media_volume:
